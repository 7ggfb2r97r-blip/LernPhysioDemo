<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#155e75" />
    <title>LernPhysio – Prüfungsvorbereitung Physiotherapie</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Hauptnavigation">
        <a class="brand" href="#home" data-view="home"><span class="brand-mark">LP</span><span>LernPhysio<small>Prüfungsvorbereitung</small></span></a>
        <nav>
          <button class="nav-link active" data-view="home">⌂ <span>Start</span></button>
          <button class="nav-link" data-view="learn">▦ <span>Lernen</span></button>
          <button class="nav-link" data-view="quizsetup">✓ <span>Quiz</span></button>
          <button class="nav-link" data-view="weak">⚠ <span>Meine Schwächen</span></button>
          <button class="nav-link" data-view="progress">◔ <span>Fortschritt</span></button>
        </nav>
        <div class="sidebar-tip">Tipp: Der Prüfungsmodus zeigt dir erst am Ende, was richtig oder falsch war – ideal zum realistischen Üben.</div>
        <div class="sidebar-credit">powered by Steffen</div>
      </aside>
      <main>
        <header class="topbar">
          <button id="menuToggle" class="icon-button mobile-only" aria-label="Menü öffnen">☰</button>
          <label class="global-search"><span>⌕</span><input id="searchInput" type="search" placeholder="Themen durchsuchen …" autocomplete="off" /></label>
          <div id="searchResults" class="search-results" hidden></div>
          <button id="resetData" class="text-button" title="Lernfortschritt zurücksetzen">Fortschritt zurücksetzen</button>
        </header>
        <div id="app" class="content" tabindex="-1"></div>
      </main>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
